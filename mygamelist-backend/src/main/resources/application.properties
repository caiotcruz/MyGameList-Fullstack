spring.application.name=mygamelist
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/mygamelist}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
api.security.token.secret=${JWT_SECRET}
api.rawg.url=https://api.rawg.io/api
api.rawg.key=${RAWG_API_KEY}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Infrastructure
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=750ms
spring.data.redis.connect-timeout=750ms
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:mygamelist}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=2
spring.rabbitmq.listener.simple.prefetch=5
spring.rabbitmq.listener.simple.default-requeue-rejected=true
app.outbox-key=${OUTBOX_KEY}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.cloud.openfeign.client.config.rawgClient.connectTimeout=2000
spring.cloud.openfeign.client.config.rawgClient.readTimeout=5000
spring.cloud.openfeign.client.config.rawgClient.loggerLevel=none
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:12}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
server.tomcat.threads.max=80
server.tomcat.accept-count=100
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
management.server.port=${MANAGEMENT_PORT:9091}
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

app.cors-origins=${CORS_ORIGINS:http://localhost:4200}

app.moderator-ids=${MODERATOR_IDS:}
app.community.migrate=${COMMUNITY_AUTO_MIGRATE:true}
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'
